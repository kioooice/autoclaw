<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片批量裁剪工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #f59e0b;
      --bg: #0f172a;
      --bg-light: #1e293b;
      --card: #1e293b;
      --card-light: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    
    .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--bg-light);
      border-radius: 12px;
      margin-bottom: 20px;
    }
    
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header h1 span { color: var(--primary); }
    
    .main-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
    }
    
    @media (max-width: 1024px) {
      .main-layout { grid-template-columns: 1fr; }
    }
    
    .sidebar { 
      display: flex; 
      flex-direction: column; 
      gap: 12px;
      max-height: calc(100vh - 140px);
      overflow-y: auto;
      padding-right: 4px;
    }
    
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: var(--bg); }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
    }
    
    .card-title {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }
    
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    
    .preset-btn {
      padding: 8px 6px;
      background: var(--card-light);
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text);
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    
    .preset-btn:hover { border-color: var(--primary); }
    .preset-btn.active { background: var(--primary); border-color: var(--primary); }
    
    .preset-btn .size {
      display: block;
      font-size: 0.6rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    
    .preset-btn.active .size { color: rgba(255,255,255,0.8); }
    
    .ratio-btn { font-weight: 600; font-size: 0.8rem !important; }
    .ratio-btn .size { font-size: 0.55rem !important; }
    
    .size-inputs {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
    }
    
    .size-inputs input {
      width: 100%;
      padding: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.875rem;
      text-align: center;
    }
    
    .size-inputs input:focus { outline: none; border-color: var(--primary); }
    .size-inputs span { color: var(--text-muted); font-size: 0.875rem; }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--card-light); }
    .btn-full { width: 100%; }
    
    .crop-container {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
    }
    
    .crop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    
    .crop-canvas-wrapper {
      position: relative;
      width: 100%;
      height: 500px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .crop-canvas-wrapper.has-image {
      background: repeating-conic-gradient(#1a1a1a 0% 25%, #2a2a2a 0% 50%) 50% / 20px 20px;
    }
    
    #cropCanvas {
      max-width: 100%;
      max-height: 100%;
    }
    
    .upload-prompt {
      text-align: center;
      color: var(--text-muted);
    }
    
    .upload-prompt svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    
    .crop-info {
      display: flex;
      gap: 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    
    .crop-info span { color: var(--text); }
    
    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    
    .slider-row label { font-size: 0.75rem; color: var(--text-muted); width: 50px; }
    .slider-row input[type="range"] { flex: 1; accent-color: var(--primary); }
    .slider-value { font-size: 0.75rem; color: var(--text); width: 45px; text-align: right; }
    
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      padding: 4px;
      border-radius: 8px;
    }
    
    .tab {
      padding: 8px 16px;
      font-size: 0.8rem;
      font-weight: 500;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .tab.active { background: var(--card); color: var(--text); }
    
    .batch-panel { display: none; }
    .batch-panel.active { display: block; }
    .single-panel { display: none; }
    .single-panel.active { display: block; }
    
    .batch-queue {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      max-height: 350px;
      overflow-y: auto;
      padding: 12px;
    }
    
    .batch-item {
      position: relative;
      background: var(--bg);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
    }
    
    .batch-item img {
      width: 100%;
      height: 80px;
      object-fit: cover;
    }
    
    .batch-item-info {
      padding: 6px;
      font-size: 0.65rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .batch-item-status {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--warning);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
    }
    
    .batch-item-status.done { background: var(--success); }
    .batch-item-status.error { background: var(--danger); }
    
    .batch-stats {
      display: flex;
      gap: 20px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
    }
    
    .progress-bar {
      height: 4px;
      background: var(--bg);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 10px;
    }
    
    .progress-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s;
    }
    
    .output-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    
    .output-row:last-child { border-bottom: none; }
    .output-label { font-size: 0.8rem; }
    
    select {
      padding: 6px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.8rem;
    }
    
    #fileInput, #batchInput { display: none; }
    
    .drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(37, 99, 235, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-size: 1.5rem;
      font-weight: 600;
    }
    
    .drop-overlay.active { display: flex; }
    
    .lock-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 10px;
    }
    
    .lock-checkbox input { accent-color: var(--primary); width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span>OneCrop</span> 批量图片裁剪工具</h1>
      <div style="font-size: 0.7rem; color: var(--text-muted);">本地处理 · 隐私安全</div>
    </header>

    <div class="main-layout">
      <div class="sidebar">
        <!-- 常用比例 -->
        <div class="card">
          <div class="card-title">常用比例</div>
          <div class="preset-grid">
            <button class="preset-btn ratio-btn active" data-w="800" data-h="800">1:1<span class="size">正方形</span></button>
            <button class="preset-btn ratio-btn" data-w="800" data-h="600">4:3<span class="size">传统屏幕</span></button>
            <button class="preset-btn ratio-btn" data-w="600" data-h="800">3:4<span class="size">竖版</span></button>
            <button class="preset-btn ratio-btn" data-w="1280" data-h="720">16:9<span class="size">宽屏</span></button>
            <button class="preset-btn ratio-btn" data-w="720" data-h="1280">9:16<span class="size">手机竖屏</span></button>
            <button class="preset-btn ratio-btn" data-w="900" data-h="600">3:2<span class="size">摄影</span></button>
            <button class="preset-btn ratio-btn" data-w="600" data-h="900">2:3<span class="size">竖版照片</span></button>
            <button class="preset-btn ratio-btn" data-w="800" data-h="1000">4:5<span class="size">Instagram</span></button>
          </div>
        </div>

        <!-- 自定义尺寸 -->
        <div class="card">
          <div class="card-title">输出尺寸</div>
          <div class="size-inputs">
            <input type="number" id="widthInput" value="800">
            <span>×</span>
            <input type="number" id="heightInput" value="800">
          </div>
          <label class="lock-checkbox">
            <input type="checkbox" id="lockRatio" checked>
            锁定宽高比
          </label>
          
          <!-- 缩放控制 -->
          <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
              <span style="font-size: 0.75rem; color: var(--text-muted);">缩放</span>
              <input type="range" id="scaleSlider" min="10" max="200" value="100" style="flex: 1;">
              <div style="display: flex; align-items: center; gap: 4px;">
                <input type="number" id="scaleInput" value="100" min="10" max="200" style="width: 55px; padding: 4px 6px; font-size: 0.75rem;">
                <span style="font-size: 0.75rem; color: var(--text-muted);">%</span>
              </div>
            </div>
            <button class="btn btn-outline" style="width: 100%; font-size: 0.75rem; padding: 6px;" onclick="resetToOriginalSize()">重置为原图尺寸</button>
          </div>
        </div>

        <!-- 输出设置 -->
        <div class="card">
          <div class="card-title">输出设置</div>
          <div class="output-row">
            <span class="output-label">格式</span>
            <select id="formatSelect">
              <option value="png">PNG 无损</option>
              <option value="jpeg" selected>JPEG 较小</option>
              <option value="webp">WebP 最新</option>
            </select>
          </div>
          <div class="output-row">
            <span class="output-label">质量</span>
            <select id="qualitySelect">
              <option value="0.9">高质量 90%</option>
              <option value="0.8" selected>标准 80%</option>
              <option value="0.6">较小 60%</option>
            </select>
          </div>
        </div>

        <!-- 操作按钮 -->
        <div class="card">
          <button class="btn btn-outline btn-full" onclick="document.getElementById('fileInput').click()">选择图片</button>
          <button class="btn btn-primary btn-full" style="margin-top:8px;" onclick="downloadCropped()">下载裁剪结果</button>
        </div>
      </div>

      <!-- 主内容区 -->
      <div class="crop-container">
        <div class="crop-header">
          <div class="tabs">
            <button class="tab active" onclick="switchTab('single')">单张裁剪</button>
            <button class="tab" onclick="switchTab('batch')">批量处理</button>
          </div>
          <div class="crop-info">
            原图: <span id="originalSize">--</span> |
            比例: <span id="currentRatio">1:1</span> |
            输出: <span id="outputSize">800x800</span>
          </div>
        </div>

        <!-- 单张裁剪面板 -->
        <div class="single-panel active">
          <div class="crop-canvas-wrapper" id="dropZone">
            <div class="upload-prompt" id="uploadPrompt">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
              <p>拖拽图片到此处</p>
              <p style="font-size: 0.75rem; margin-top: 8px;">支持鼠标拖动调整位置和大小</p>
            </div>
            <canvas id="cropCanvas" style="display: none;"></canvas>
          </div>
          <div style="padding: 12px 16px; border-top: 1px solid var(--border);">
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              <button class="btn btn-outline" onclick="resetCrop()">重置</button>
              <button class="btn btn-outline" onclick="fitToScreen()">适应</button>
              <button class="btn btn-outline" onclick="rotateImage(-90)">↺ 左转90°</button>
              <button class="btn btn-outline" onclick="rotateImage(90)">↻ 右转90°</button>
              <button class="btn btn-outline" onclick="flipImage('h')">⇆ 水平翻转</button>
              <button class="btn btn-outline" onclick="flipImage('v')">⇅ 垂直翻转</button>
            </div>
          </div>
        </div>

        <!-- 批量处理面板 -->
        <div class="batch-panel">
          <div style="padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center;">
            <button class="btn btn-outline" onclick="document.getElementById('batchInput').click()">添加图片</button>
            <button class="btn btn-success" onclick="processBatch()" id="batchProcessBtn">开始批量裁剪</button>
            <button class="btn btn-primary" onclick="downloadBatch()">下载全部 ZIP</button>
            <button class="btn btn-danger" onclick="clearBatch()">清空</button>
            <span style="margin-left: auto; font-size: 0.8rem;">共 <strong id="batchCount">0</strong> 张</span>
          </div>
          <div class="batch-queue" id="batchQueue">
            <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 60px;">点击「添加图片」或拖拽文件夹到此处</div>
          </div>
          <div class="batch-stats">
            <div>待处理: <strong id="pendingCount">0</strong></div>
            <div>已完成: <strong id="doneCount">0</strong></div>
            <div>失败: <strong id="errorCount">0</strong></div>
          </div>
          <div class="progress-bar" style="margin: 0 16px 12px;">
            <div class="progress-fill" id="batchProgress" style="width: 0%;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="drop-overlay" id="dropOverlay">释放以上传图片</div>

  <input type="file" id="fileInput" accept="image/*">
  <input type="file" id="batchInput" accept="image/*" multiple>

  <script>
    // 状态管理
    const state = {
      currentImage: null,
      cropX: 0, cropY: 0, cropW: 800, cropH: 800,
      outputW: 800, outputH: 800,
      originalW: 800, originalH: 800, // 原图尺寸基准
      scale: 100,
      lockRatio: true,
      currentRatio: 1,
      isDragging: false,
      isResizing: false,
      resizeHandle: null,
      dragStartX: 0, dragStartY: 0,
      startCropX: 0, startCropY: 0, startCropW: 0, startCropH: 0,
      handleSize: 12,
      batchImages: [],
      batchResults: []
    };

    const canvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d');
    const dropZone = document.getElementById('dropZone');

    // 比例锁定
    document.getElementById('lockRatio').addEventListener('change', e => {
      state.lockRatio = e.target.checked;
      if (state.lockRatio) state.currentRatio = state.outputW / state.outputH;
    });

    // 比例按钮
    document.querySelectorAll('.ratio-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const targetRatio = parseInt(btn.dataset.w) / parseInt(btn.dataset.h);
        state.currentRatio = targetRatio;
        
        // 以原图为基准计算输出尺寸
        if (state.currentImage) {
          const img = state.currentImage;
          const imgRatio = img.width / img.height;
          
          if (imgRatio > targetRatio) {
            // 图片更宽，以高度为基准
            state.outputH = img.height;
            state.outputW = Math.round(img.height * targetRatio);
          } else {
            // 图片更高，以宽度为基准
            state.outputW = img.width;
            state.outputH = Math.round(img.width / targetRatio);
          }
          
          // 更新基准尺寸和缩放
          state.originalW = state.outputW;
          state.originalH = state.outputH;
          state.scale = 100;
          document.getElementById('scaleSlider').value = 100;
          document.getElementById('scaleInput').value = 100;
        } else {
          // 没有图片时使用预设尺寸
          state.outputW = parseInt(btn.dataset.w);
          state.outputH = parseInt(btn.dataset.h);
        }
        
        document.getElementById('widthInput').value = state.outputW;
        document.getElementById('heightInput').value = state.outputH;
        document.getElementById('lockRatio').checked = true;
        state.lockRatio = true;
        updateOutputSize();
        if (state.currentImage) { resetCrop(); }
      });
    });

    // 尺寸输入
    document.getElementById('widthInput').addEventListener('input', e => {
      state.outputW = Math.max(1, parseInt(e.target.value) || 100);
      if (state.lockRatio) {
        state.outputH = Math.round(state.outputW / state.currentRatio);
        document.getElementById('heightInput').value = state.outputH;
      }
      // 更新基准和缩放
      state.originalW = state.outputW;
      state.originalH = state.outputH;
      state.scale = 100;
      document.getElementById('scaleSlider').value = 100;
      document.getElementById('scaleInput').value = 100;
      updateOutputSize();
      if (state.currentImage) resetCrop();
    });

    document.getElementById('heightInput').addEventListener('input', e => {
      state.outputH = Math.max(1, parseInt(e.target.value) || 100);
      if (state.lockRatio) {
        state.outputW = Math.round(state.outputH * state.currentRatio);
        document.getElementById('widthInput').value = state.outputW;
      }
      // 更新基准和缩放
      state.originalW = state.outputW;
      state.originalH = state.outputH;
      state.scale = 100;
      document.getElementById('scaleSlider').value = 100;
      document.getElementById('scaleInput').value = 100;
      updateOutputSize();
      if (state.currentImage) resetCrop();
    });

    // 缩放控制
    document.getElementById('scaleSlider').addEventListener('input', e => {
      state.scale = parseInt(e.target.value);
      document.getElementById('scaleInput').value = state.scale;
      applyScale();
    });

    document.getElementById('scaleInput').addEventListener('input', e => {
      let val = parseInt(e.target.value) || 100;
      val = Math.max(10, Math.min(200, val));
      state.scale = val;
      document.getElementById('scaleSlider').value = val;
      e.target.value = val;
      applyScale();
    });

    function applyScale() {
      if (!state.currentImage) return;
      state.outputW = Math.round(state.originalW * state.scale / 100);
      state.outputH = Math.round(state.originalH * state.scale / 100);
      document.getElementById('widthInput').value = state.outputW;
      document.getElementById('heightInput').value = state.outputH;
      updateOutputSize();
      resetCrop();
    }

    function resetToOriginalSize() {
      if (!state.currentImage) return;
      state.scale = 100;
      document.getElementById('scaleSlider').value = 100;
      document.getElementById('scaleInput').value = 100;
      state.outputW = state.originalW;
      state.outputH = state.originalH;
      document.getElementById('widthInput').value = state.outputW;
      document.getElementById('heightInput').value = state.outputH;
      updateOutputSize();
      resetCrop();
    }

    // 旋转图片
    function rotateImage(angle) {
      if (!state.currentImage) return;
      
      const img = state.currentImage;
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      
      if (angle === 90 || angle === -90) {
        // 旋转90度，宽高互换
        tempCanvas.width = img.height;
        tempCanvas.height = img.width;
        
        tempCtx.translate(tempCanvas.width / 2, tempCanvas.height / 2);
        tempCtx.rotate(angle * Math.PI / 180);
        tempCtx.drawImage(img, -img.width / 2, -img.height / 2);
        
        // 更新输出尺寸
        const newW = state.outputH;
        const newH = state.outputW;
        state.outputW = newW;
        state.outputH = newH;
        state.originalW = tempCanvas.width;
        state.originalH = tempCanvas.height;
        state.currentRatio = newW / newH;
        
        document.getElementById('widthInput').value = newW;
        document.getElementById('heightInput').value = newH;
      } else if (angle === 180) {
        tempCanvas.width = img.width;
        tempCanvas.height = img.height;
        tempCtx.translate(tempCanvas.width / 2, tempCanvas.height / 2);
        tempCtx.rotate(Math.PI);
        tempCtx.drawImage(img, -img.width / 2, -img.height / 2);
      }
      
      // 创建新图片
      const newImg = new Image();
      newImg.onload = () => {
        state.currentImage = newImg;
        updateOutputSize();
        resetCrop();
      };
      newImg.src = tempCanvas.toDataURL();
    }

    // 翻转图片
    function flipImage(direction) {
      if (!state.currentImage) return;
      
      const img = state.currentImage;
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      
      tempCanvas.width = img.width;
      tempCanvas.height = img.height;
      
      if (direction === 'h') {
        // 水平翻转
        tempCtx.translate(tempCanvas.width, 0);
        tempCtx.scale(-1, 1);
      } else {
        // 垂直翻转
        tempCtx.translate(0, tempCanvas.height);
        tempCtx.scale(1, -1);
      }
      
      tempCtx.drawImage(img, 0, 0);
      
      const newImg = new Image();
      newImg.onload = () => {
        state.currentImage = newImg;
        drawCrop();
      };
      newImg.src = tempCanvas.toDataURL();
    }

    function updateOutputSize() {
      document.getElementById('outputSize').textContent = `${state.outputW}×${state.outputH}`;
      const r = state.outputW / state.outputH;
      let rt = r.toFixed(2) + ':1';
      if (Math.abs(r - 1) < 0.01) rt = '1:1';
      else if (Math.abs(r - 4/3) < 0.01) rt = '4:3';
      else if (Math.abs(r - 3/4) < 0.01) rt = '3:4';
      else if (Math.abs(r - 16/9) < 0.01) rt = '16:9';
      else if (Math.abs(r - 9/16) < 0.01) rt = '9:16';
      else if (Math.abs(r - 3/2) < 0.01) rt = '3:2';
      else if (Math.abs(r - 2/3) < 0.01) rt = '2:3';
      else if (Math.abs(r - 4/5) < 0.01) rt = '4:5';
      document.getElementById('currentRatio').textContent = rt;
    }

    // 文件上传
    document.getElementById('fileInput').addEventListener('change', e => {
      if (e.target.files[0]) loadImage(e.target.files[0]);
    });

    document.getElementById('batchInput').addEventListener('change', e => {
      addBatchFiles(e.target.files);
    });

    // 拖拽上传
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(event => {
      document.addEventListener(event, e => { e.preventDefault(); e.stopPropagation(); });
    });

    document.addEventListener('dragover', () => document.getElementById('dropOverlay').classList.add('active'));
    document.addEventListener('dragleave', e => { if (e.relatedTarget === null) document.getElementById('dropOverlay').classList.remove('active'); });
    document.addEventListener('drop', e => {
      document.getElementById('dropOverlay').classList.remove('active');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        if (files.length === 1 && files[0].type.startsWith('image/')) loadImage(files[0]);
        else { addBatchFiles(files); switchTab('batch'); }
      }
    });

    function loadImage(file) {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          state.currentImage = img;
          document.getElementById('uploadPrompt').style.display = 'none';
          canvas.style.display = 'block';
          dropZone.classList.add('has-image');
          
          // 默认输出尺寸为原图尺寸
          state.outputW = img.width;
          state.outputH = img.height;
          state.originalW = img.width;  // 保存原图尺寸
          state.originalH = img.height;
          state.currentRatio = img.width / img.height;
          state.scale = 100;
          document.getElementById('widthInput').value = img.width;
          document.getElementById('heightInput').value = img.height;
          document.getElementById('scaleSlider').value = 100;
          document.getElementById('scaleInput').value = 100;
          updateOutputSize();
          
          resetCrop();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 获取手柄位置
    function getHandles() {
      const scaleX = canvas.width / state.currentImage.width;
      const scaleY = canvas.height / state.currentImage.height;
      const x = state.cropX * scaleX, y = state.cropY * scaleY;
      const w = state.cropW * scaleX, h = state.cropH * scaleY;
      const s = state.handleSize;
      return {
        nw: { x: x - s/2, y: y - s/2 }, n: { x: x + w/2 - s/2, y: y - s/2 },
        ne: { x: x + w - s/2, y: y - s/2 }, e: { x: x + w - s/2, y: y + h/2 - s/2 },
        se: { x: x + w - s/2, y: y + h - s/2 }, s: { x: x + w/2 - s/2, y: y + h - s/2 },
        sw: { x: x - s/2, y: y + h - s/2 }, w: { x: x - s/2, y: y + h/2 - s/2 }
      };
    }

    function getHandleAt(mx, my) {
      if (!state.currentImage) return null;
      const handles = getHandles(), s = state.handleSize;
      for (const [name, h] of Object.entries(handles)) {
        if (mx >= h.x && mx <= h.x + s && my >= h.y && my <= h.y + s) return name;
      }
      const scaleX = canvas.width / state.currentImage.width;
      const scaleY = canvas.height / state.currentImage.height;
      const x = state.cropX * scaleX, y = state.cropY * scaleY;
      const w = state.cropW * scaleX, h = state.cropH * scaleY;
      if (mx >= x && mx <= x + w && my >= y && my <= y + h) return 'move';
      return null;
    }

    // 绘制裁剪框
    function drawCrop() {
      if (!state.currentImage) return;
      const img = state.currentImage;

      // Canvas尺寸
      const maxW = dropZone.clientWidth - 40, maxH = dropZone.clientHeight - 40;
      const ratio = img.width / img.height;
      let dispW, dispH;
      if (ratio > maxW / maxH) { dispW = Math.min(img.width, maxW); dispH = dispW / ratio; }
      else { dispH = Math.min(img.height, maxH); dispW = dispH * ratio; }
      canvas.width = dispW; canvas.height = dispH;

      ctx.drawImage(img, 0, 0, dispW, dispH);

      const scaleX = dispW / img.width, scaleY = dispH / img.height;
      const rectX = state.cropX * scaleX, rectY = state.cropY * scaleY;
      const rectW = state.cropW * scaleX, rectH = state.cropH * scaleY;

      // 遮罩
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, dispW, rectY);
      ctx.fillRect(0, rectY + rectH, dispW, dispH - rectY - rectH);
      ctx.fillRect(0, rectY, rectX, rectH);
      ctx.fillRect(rectX + rectW, rectY, dispW - rectX - rectW, rectH);

      // 边框
      ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2;
      ctx.strokeRect(rectX, rectY, rectW, rectH);

      // 三分线
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(rectX + rectW/3, rectY); ctx.lineTo(rectX + rectW/3, rectY + rectH);
      ctx.moveTo(rectX + rectW*2/3, rectY); ctx.lineTo(rectX + rectW*2/3, rectY + rectH);
      ctx.moveTo(rectX, rectY + rectH/3); ctx.lineTo(rectX + rectW, rectY + rectH/3);
      ctx.moveTo(rectX, rectY + rectH*2/3); ctx.lineTo(rectX + rectW, rectY + rectH*2/3);
      ctx.stroke();

      // 调整手柄
      const s = state.handleSize;
      ctx.fillStyle = '#2563eb';
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      [[rectX, rectY], [rectX + rectW/2, rectY], [rectX + rectW, rectY],
       [rectX + rectW, rectY + rectH/2], [rectX + rectW, rectY + rectH],
       [rectX + rectW/2, rectY + rectH], [rectX, rectY + rectH], [rectX, rectY + rectH/2]
      ].forEach(([hx, hy]) => {
        ctx.fillRect(hx - s/2, hy - s/2, s, s);
        ctx.strokeRect(hx - s/2, hy - s/2, s, s);
      });

      document.getElementById('originalSize').textContent = `${img.width}×${img.height}`;
    }

    // 鼠标事件
    canvas.addEventListener('mousedown', e => {
      if (!state.currentImage) return;
      const rect = canvas.getBoundingClientRect();
      const handle = getHandleAt(e.clientX - rect.left, e.clientY - rect.top);
      if (handle) {
        if (handle === 'move') state.isDragging = true;
        else { state.isResizing = true; state.resizeHandle = handle; }
        state.dragStartX = e.clientX; state.dragStartY = e.clientY;
        state.startCropX = state.cropX; state.startCropY = state.cropY;
        state.startCropW = state.cropW; state.startCropH = state.cropH;
      }
    });

    canvas.addEventListener('mousemove', e => {
      if (!state.currentImage) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const handle = getHandleAt(mx, my);
      const cursors = { nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize', n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize', move: 'move' };
      canvas.style.cursor = cursors[handle] || 'default';

      if (state.isDragging) {
        const scaleX = state.currentImage.width / canvas.width;
        const scaleY = state.currentImage.height / canvas.height;
        const dx = e.clientX - state.dragStartX, dy = e.clientY - state.dragStartY;
        state.cropX = Math.max(0, Math.min(state.startCropX + dx * scaleX, state.currentImage.width - state.cropW));
        state.cropY = Math.max(0, Math.min(state.startCropY + dy * scaleY, state.currentImage.height - state.cropH));
        drawCrop();
      }

      if (state.isResizing) {
        const img = state.currentImage;
        const scaleX = img.width / canvas.width, scaleY = img.height / canvas.height;
        const dx = (e.clientX - state.dragStartX) * scaleX, dy = (e.clientY - state.dragStartY) * scaleY;
        const minSize = 50;

        if (state.resizeHandle === 'se') {
          state.cropW = Math.max(minSize, Math.min(state.startCropW + dx, img.width - state.cropX));
          state.cropH = state.lockRatio ? state.cropW / state.currentRatio : Math.max(minSize, Math.min(state.startCropH + dy, img.height - state.cropY));
        } else if (state.resizeHandle === 'e') {
          state.cropW = Math.max(minSize, Math.min(state.startCropW + dx, img.width - state.cropX));
          if (state.lockRatio) state.cropH = state.cropW / state.currentRatio;
        } else if (state.resizeHandle === 's') {
          state.cropH = Math.max(minSize, Math.min(state.startCropH + dy, img.height - state.cropY));
          if (state.lockRatio) state.cropW = state.cropH * state.currentRatio;
        } else if (state.resizeHandle === 'nw') {
          const newW = Math.max(minSize, state.startCropW - dx);
          const newX = state.startCropX + state.startCropW - newW;
          if (newX >= 0) { state.cropW = newW; state.cropX = newX; if (state.lockRatio) { const newH = state.cropW / state.currentRatio; state.cropY += state.cropH - newH; state.cropH = newH; } }
        } else if (state.resizeHandle === 'ne') {
          state.cropW = Math.max(minSize, Math.min(state.startCropW + dx, img.width - state.cropX));
          if (state.lockRatio) { const newH = state.cropW / state.currentRatio; state.cropY += state.cropH - newH; state.cropH = newH; }
        } else if (state.resizeHandle === 'sw') {
          const newW = Math.max(minSize, state.startCropW - dx);
          const newX = state.startCropX + state.startCropW - newW;
          if (newX >= 0) { state.cropW = newW; state.cropX = newX; if (state.lockRatio) state.cropH = state.cropW / state.currentRatio; }
        } else if (state.resizeHandle === 'n') {
          const newH = Math.max(minSize, state.startCropH - dy);
          const newY = state.startCropY + state.startCropH - newH;
          if (newY >= 0) { state.cropH = newH; state.cropY = newY; if (state.lockRatio) state.cropW = state.cropH * state.currentRatio; }
        } else if (state.resizeHandle === 'w') {
          const newW = Math.max(minSize, state.startCropW - dx);
          const newX = state.startCropX + state.startCropW - newW;
          if (newX >= 0) { state.cropW = newW; state.cropX = newX; if (state.lockRatio) state.cropH = state.cropW / state.currentRatio; }
        }

        state.cropX = Math.max(0, state.cropX); state.cropY = Math.max(0, state.cropY);
        state.cropW = Math.min(state.cropW, img.width - state.cropX);
        state.cropH = Math.min(state.cropH, img.height - state.cropY);
        drawCrop();
      }
    });

    document.addEventListener('mouseup', () => { state.isDragging = false; state.isResizing = false; state.resizeHandle = null; });

    // 键盘快捷键
    document.addEventListener('keydown', e => {
      if (!state.currentImage) return;
      if (e.key === 'r') resetCrop();
      else if (e.key === 'R') rotateImage(-90);
      else if (e.key === 'E') rotateImage(90);
    });

    function resetCrop() {
      if (!state.currentImage) return;
      const img = state.currentImage, ratio = state.outputW / state.outputH;
      if (img.width / img.height > ratio) {
        state.cropH = Math.min(img.height, state.outputH);
        state.cropW = state.cropH * ratio;
      } else {
        state.cropW = Math.min(img.width, state.outputW);
        state.cropH = state.cropW / ratio;
      }
      state.cropX = (img.width - state.cropW) / 2;
      state.cropY = (img.height - state.cropH) / 2;
      state.startCropX = state.cropX; state.startCropY = state.cropY;
      state.startCropW = state.cropW; state.startCropH = state.cropH;
      drawCrop();
    }

    function fitToScreen() {
      if (!state.currentImage) return;
      const img = state.currentImage, ratio = state.outputW / state.outputH;
      state.cropW = img.width; state.cropH = img.width / ratio;
      if (state.cropH > img.height) { state.cropH = img.height; state.cropW = img.height * ratio; }
      state.cropX = (img.width - state.cropW) / 2;
      state.cropY = (img.height - state.cropH) / 2;
      drawCrop();
    }

    // 导出
    function getCroppedBlob() {
      return new Promise(resolve => {
        if (!state.currentImage) { resolve(null); return; }
        const oc = document.createElement('canvas');
        oc.width = state.outputW; oc.height = state.outputH;
        const octx = oc.getContext('2d');
        octx.drawImage(state.currentImage, state.cropX, state.cropY, state.cropW, state.cropH, 0, 0, state.outputW, state.outputH);
        const format = document.getElementById('formatSelect').value;
        const quality = parseFloat(document.getElementById('qualitySelect').value);
        const mime = format === 'png' ? 'image/png' : format === 'jpeg' ? 'image/jpeg' : 'image/webp';
        oc.toBlob(resolve, mime, quality);
      });
    }

    async function downloadCropped() {
      const blob = await getCroppedBlob();
      if (!blob) { alert('请先上传图片'); return; }
      const format = document.getElementById('formatSelect').value;
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `cropped_${Date.now()}.${format}`;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    // 批量处理
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
      document.querySelectorAll('.single-panel, .batch-panel').forEach(p => p.classList.remove('active'));
      document.querySelector(`.${tab}-panel`).classList.add('active');
    }

    function addBatchFiles(files) {
      const queue = document.getElementById('batchQueue');
      if (state.batchImages.length === 0) queue.innerHTML = '';
      Array.from(files).forEach(file => {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = e => {
            const img = new Image();
            img.onload = () => {
              state.batchImages.push({ name: file.name, image: img, status: 'pending' });
              const item = document.createElement('div');
              item.className = 'batch-item';
              item.innerHTML = `<img src="${e.target.result}"><div class="batch-item-info">${file.name}</div><div class="batch-item-status">⏳</div>`;
              queue.appendChild(item);
              updateBatchStats();
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }
      });
      switchTab('batch');
    }

    function updateBatchStats() {
      document.getElementById('batchCount').textContent = state.batchImages.length;
      document.getElementById('pendingCount').textContent = state.batchImages.filter(i => i.status === 'pending').length;
      document.getElementById('doneCount').textContent = state.batchImages.filter(i => i.status === 'done').length;
      document.getElementById('errorCount').textContent = state.batchImages.filter(i => i.status === 'error').length;
    }

    async function processBatch() {
      if (state.batchImages.length === 0) { alert('请先添加图片'); return; }
      state.batchResults = [];
      const btn = document.getElementById('batchProcessBtn'); btn.disabled = true; btn.textContent = '处理中...';
      const format = document.getElementById('formatSelect').value;
      const quality = parseFloat(document.getElementById('qualitySelect').value);
      const mime = format === 'png' ? 'image/png' : format === 'jpeg' ? 'image/jpeg' : 'image/webp';

      for (let i = 0; i < state.batchImages.length; i++) {
        const item = state.batchImages[i];
        const statusEl = document.querySelectorAll('.batch-item-status')[i];
        try {
          const img = item.image, ratio = state.outputW / state.outputH;
          let cropW, cropH;
          if (img.width / img.height > ratio) { cropH = Math.min(img.height, state.outputH); cropW = cropH * ratio; }
          else { cropW = Math.min(img.width, state.outputW); cropH = cropW / ratio; }
          const cropX = (img.width - cropW) / 2, cropY = (img.height - cropH) / 2;
          const oc = document.createElement('canvas');
          oc.width = state.outputW; oc.height = state.outputH;
          oc.getContext('2d').drawImage(img, cropX, cropY, cropW, cropH, 0, 0, state.outputW, state.outputH);
          const blob = await new Promise(r => oc.toBlob(r, mime, quality));
          state.batchResults.push({ name: item.name, blob });
          item.status = 'done';
          if (statusEl) { statusEl.textContent = '✓'; statusEl.classList.add('done'); }
        } catch (e) { item.status = 'error'; if (statusEl) { statusEl.textContent = '✗'; statusEl.classList.add('error'); } }
        document.getElementById('batchProgress').style.width = ((i + 1) / state.batchImages.length * 100) + '%';
        updateBatchStats();
      }
      btn.disabled = false; btn.textContent = '开始批量裁剪';
      alert(`完成！成功 ${state.batchResults.length} 张`);
    }

    async function downloadBatch() {
      if (state.batchResults.length === 0) { alert('请先处理图片'); return; }
      const zip = new JSZip();
      const format = document.getElementById('formatSelect').value;
      state.batchResults.forEach(item => zip.file(item.name.replace(/\.[^.]+$/, '') + '.' + format, item.blob));
      const link = document.createElement('a');
      link.href = URL.createObjectURL(await zip.generateAsync({ type: 'blob' }));
      link.download = `cropped_${Date.now()}.zip`;
      link.click();
    }

    function clearBatch() {
      state.batchImages = []; state.batchResults = [];
      document.getElementById('batchQueue').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:60px;">点击「添加图片」或拖拽文件夹到此处</div>';
      document.getElementById('batchProgress').style.width = '0%';
      updateBatchStats();
    }

    updateOutputSize();
  </script>
</body>
</html>
