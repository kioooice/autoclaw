version: '3.8'

services:
  activepieces:
    image: activepieces/activepieces:latest
    container_name: activepieces
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - AP_ENGINE_EXECUTABLE_PATH=dist/packages/engine/main.js
      - AP_API_URL=http://localhost:8080
      - AP_FRONTEND_URL=http://localhost:8080
      - AP_JWT_SECRET=ap-jwt-secret-2026-activepieces-secure
      - AP_ENCRYPTION_KEY=8b8493a47006f4820c8e4a31d947eb4d
      - AP_TELEMETRY_ENABLED=false
      - AP_POSTGRES_HOST=postgres
      - AP_POSTGRES_PORT=5432
      - AP_POSTGRES_DATABASE=activepieces
      - AP_POSTGRES_USERNAME=activepieces
      - AP_POSTGRES_PASSWORD=activepieces
      - AP_REDIS_HOST=redis
      - AP_REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - activepieces-network

  postgres:
    image: postgres:15-alpine
    container_name: activepieces-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=activepieces
      - POSTGRES_PASSWORD=activepieces
      - POSTGRES_DB=activepieces
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activepieces"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - activepieces-network

  redis:
    image: redis:7-alpine
    container_name: activepieces-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - activepieces-network

volumes:
  postgres-data:
  redis-data:

networks:
  activepieces-network:
    driver: bridge